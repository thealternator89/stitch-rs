[package]
name = "stitch-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
directories = "6"
github-copilot-sdk = "1"
globset = "0.4"
gpui-kit = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify-rust = { version = "4.19", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
url = "2"
