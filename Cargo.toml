[package]
name = "stitch-rs"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "Stitch"
identifier = "com.stitch.app"
icon = ["assets/icon.icns", "assets/icon.ico"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
directories = "6"
github-copilot-sdk = { version = "1", default-features = false, features = ["runtime"] }
globset = "0.4"
gpui-kit = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libsqlite3-sys = { version = "0.40.0", features = ["bundled"] }
notify-rust = { version = "4.19", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSObjCRuntime"] }

[profile.release]
lto = "thin"
panic = "abort"
strip = true
